<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station Platform</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  :root { --bg:#14161a; --panel:#1c1f25; --line:#2b2f38; --fg:#d8dce4; --dim:#8a92a3; --acc:#4aa3ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,"Segoe UI",sans-serif; }
  #app { display:flex; height:100vh; }
  #stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#0d0e11; }
  #stage canvas#view { display:block; background:#000; }
  .overlay { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; }
  img.overlay { object-fit:fill; }
  #panel { width:360px; overflow-y:auto; background:var(--panel); border-left:1px solid var(--line); padding:6px 10px 40px; }
  details.sec { border-bottom:1px solid var(--line); padding:4px 0 8px; }
  summary { cursor:pointer; font-weight:600; padding:6px 0; color:#fff; }
  .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .row .lab { width:112px; color:var(--dim); flex:none; font-size:12px; }
  .row input[type=range] { flex:1; min-width:0; }
  .row .val { width:46px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px; }
  input[type=number], input[type=text], select { background:#101216; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 4px; min-width:0; }
  .row input[type=number], .row select { flex:1; }
  .btnrow { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  button { background:#262b35; color:var(--fg); border:1px solid #3a4150; border-radius:5px; padding:4px 9px; cursor:pointer; }
  button:hover { background:#303644; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#04111f; font-weight:600; }
  .note { color:var(--dim); font-size:12px; margin:4px 0; }
  .ref { display:flex; align-items:center; gap:3px; margin:3px 0; font-size:12px; }
  .ref input[type=number] { width:52px; } .ref input[type=text] { width:48px; }
  .err { width:46px; color:#2ee6d6; font-size:11px; }
  .status { margin-top:10px; color:var(--acc); font-size:12px; word-break:break-all; }
  @media (max-width: 800px) {
    #app { flex-direction: column; height: 100dvh; }
    #stage { flex: none; width: 100%; height: 45dvh; }
    #panel { width: 100%; flex: 1; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="view"></canvas></div>
  <div id="panel"></div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
